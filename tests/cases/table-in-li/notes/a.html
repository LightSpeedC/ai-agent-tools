<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><title>li の中の表</title></head><body>
<div class="titlebar"><div class="inner"><h1>li の中の表</h1></div></div>
<div class="wrap">
<!-- li の中の表は、記号の幅だけ字下げした Markdown の表として出す (i261101-04) -->
<ul>
<li>前の文 <table><thead><tr><th>名前</th><th>結果</th></tr></thead><tbody><tr><td><strong>太</strong></td><td>細</td></tr></tbody></table> 後の文</li>
<li>表なし</li>
<li>二つ <table><tr><td>a</td></tr></table><table><tr><td>b</td></tr></table></li>
<li>スキップ <table class="md-skip"><tr><td>x</td></tr></table></li>
<li>入れ子の親<ul><li>子 <table><tr><th>x</th><th>y</th></tr><tr><td>1</td><td>2</td></tr></table></li></ul></li>
</ul>
<ol>
<li>一</li>
<li>二 <table><tr><td>c</td></tr></table></li>
<li>三</li>
<li>四</li>
<li>五</li>
<li>六</li>
<li>七</li>
<li>八</li>
<li>九</li>
<li>十 <table><tr><td>d</td></tr></table></li>
</ol>
</div>
</body></html>
