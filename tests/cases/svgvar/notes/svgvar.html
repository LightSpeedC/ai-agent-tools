<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><title>SVG の CSS 変数</title>
<style>
	:root{
		--accent:#12224d; --accent2:#2f5fbf; --soft:#f2f5fb;
		--line:#d9dfe8;
	}
	/* 章のアクセント色（2 章） */
	.ch01{ --accent:hsl(280,78%,25%); --accent2:hsl(280,58%,55%); --soft:hsl(280,28%,95%); }
	.ch02{ --accent:hsl(0,78%,25%);   --accent2:hsl(0,58%,55%);   --soft:hsl(0,28%,95%); }

	@media (prefers-color-scheme: dark) {
		:root:not([data-theme="light"]){ --accent:#ffffff; --accent2:#eeeeee; }
	}
</style>
</head><body>
<div class="titlebar"><div class="inner"><h1>SVG の CSS 変数</h1></div></div>
<div class="wrap">

<section class="ch01" id="ch01">
	<h1>章の中の図</h1>
	<figure>
		<svg viewBox="0 0 200 60" aria-label="ch01 の図">
			<defs>
				<linearGradient id="g-01-1" x1="0" y1="1" x2="0" y2="0">
					<stop offset="0" stop-color="var(--accent)"/>
					<stop offset="1" stop-color="var(--accent2)"/>
				</linearGradient>
			</defs>
			<rect x="10" y="10" width="180" height="40" fill="url(#g-01-1)" stroke="var(--line, #cccccc)"/>
			<text x="100" y="35" fill="#fff">ch01</text>
		</svg>
		<figcaption>章の中の図</figcaption>
	</figure>
</section>

<section class="ch02" id="ch02">
	<h1>別の章の図</h1>
	<figure>
		<svg viewBox="0 0 200 60" aria-label="ch02 の図">
			<defs>
				<linearGradient id="g-02-1" x1="0" y1="1" x2="0" y2="0">
					<stop offset="0" stop-color="var(--accent)"/>
					<stop offset="1" stop-color="var(--accent2)"/>
				</linearGradient>
			</defs>
			<rect x="10" y="10" width="180" height="40" fill="url(#g-02-1)"/>
			<text x="100" y="35" fill="var(--soft)">ch02</text>
		</svg>
		<figcaption>別の章の図</figcaption>
	</figure>
</section>

<figure>
	<svg viewBox="0 0 200 60" aria-label="章の外の図">
		<rect x="10" y="10" width="180" height="40" fill="var(--accent)"/>
		<text x="100" y="35" fill="var(--nothing, #336699)">章の外</text>
		<text x="100" y="50" fill="var(--unknown)">解決できない</text>
	</svg>
	<figcaption>章の外の図</figcaption>
</figure>

</div>
</body></html>
