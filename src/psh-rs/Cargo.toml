[package]
name = "psh"
version = "0.1.0"
edition = "2021"
description = "PowerShell を呼んで、出力を UTF-8 に直して流す（src/psh/psh-main.ts の Rust 版）"
publish = false

# 本体のファイル名を psh-main.rs にしている（既定の src/main.rs ではない）
[[bin]]
name = "psh"
path = "src/psh-main.rs"

[dependencies]
# CP932 の読み。WHATWG の shift_jis の実装で、TypeScript 版の TextDecoder('shift_jis') と同じ表
encoding_rs = "0.8"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
