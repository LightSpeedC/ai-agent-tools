<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 310" width="1140" height="310" role="img">
<rect width="100%" height="100%" fill="#ffffff"/>
<defs>
	<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(280,78%,25%)"/><stop offset="1" stop-color="hsl(280,58%,55%)"/></linearGradient>
	<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(210,78%,25%)"/><stop offset="1" stop-color="hsl(210,58%,55%)"/></linearGradient>
	<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(140,78%,25%)"/><stop offset="1" stop-color="hsl(140,58%,55%)"/></linearGradient>
	<linearGradient id="i4" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(70,78%,25%)"/><stop offset="1" stop-color="hsl(70,58%,55%)"/></linearGradient>
	<linearGradient id="i5" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="hsl(0,78%,25%)"/><stop offset="1" stop-color="hsl(0,58%,55%)"/></linearGradient>
	<marker id="i6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
		<path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
	</marker>
</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

<rect x="440" y="16" width="260" height="52" rx="8" fill="url(#i1)"/>
<text x="570" y="38" text-anchor="middle" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="13" font-weight="700" fill="#ffffff">BOM を見る</text>
<text x="570" y="56" text-anchor="middle" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="11" fill="#ffffff">あれば、そこで確定</text>

<rect x="440" y="96" width="260" height="52" rx="8" fill="url(#i2)"/>
<text x="570" y="118" text-anchor="middle" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="13" font-weight="700" fill="#ffffff">両方で検査する</text>
<text x="570" y="136" text-anchor="middle" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="11" fill="#ffffff">UTF-8 として／SJIS として</text>

<line x1="570" y1="72" x2="570" y2="92" stroke="#4a5568" stroke-width="2" marker-end="url(#i6)"/>
<line x1="570" y1="152" x2="570" y2="172" stroke="#4a5568" stroke-width="2"/>
<line x1="150" y1="172" x2="990" y2="172" stroke="#4a5568" stroke-width="2"/>
<line x1="150" y1="172" x2="150" y2="192" stroke="#4a5568" stroke-width="2" marker-end="url(#i6)"/>
<line x1="430" y1="172" x2="430" y2="192" stroke="#4a5568" stroke-width="2" marker-end="url(#i6)"/>
<line x1="710" y1="172" x2="710" y2="192" stroke="#4a5568" stroke-width="2" marker-end="url(#i6)"/>
<line x1="990" y1="172" x2="990" y2="192" stroke="#4a5568" stroke-width="2" marker-end="url(#i6)"/>

<rect x="20" y="196" width="260" height="72" rx="8" fill="url(#i2)"/>
<text x="150" y="220" text-anchor="middle" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="13" font-weight="700" fill="#ffffff">UTF-8 だけ妥当</text>
<text x="150" y="242" text-anchor="middle" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="12" fill="#ffffff">UTF-8 に決める</text>
<text x="150" y="260" text-anchor="middle" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="11" fill="#ffffff">漢字があればほぼここ</text>

<rect x="300" y="196" width="260" height="72" rx="8" fill="url(#i3)"/>
<text x="430" y="220" text-anchor="middle" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="13" font-weight="700" fill="#ffffff">SJIS だけ妥当</text>
<text x="430" y="242" text-anchor="middle" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="12" fill="#ffffff">SJIS に決める</text>
<text x="430" y="260" text-anchor="middle" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="11" fill="#ffffff">漢字があればほぼここ</text>

<rect x="580" y="196" width="260" height="72" rx="8" fill="url(#i4)"/>
<text x="710" y="220" text-anchor="middle" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="13" font-weight="700" fill="#ffffff">両方とも妥当</text>
<text x="710" y="242" text-anchor="middle" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="12" fill="#ffffff">純 ASCII なら UTF-8</text>
<text x="710" y="260" text-anchor="middle" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="11" fill="#ffffff">そうでなければ止める</text>

<rect x="860" y="196" width="260" height="72" rx="8" fill="url(#i5)"/>
<text x="990" y="220" text-anchor="middle" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="13" font-weight="700" fill="#ffffff">どちらでもない</text>
<text x="990" y="242" text-anchor="middle" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="12" fill="#ffffff">止める</text>
<text x="990" y="260" text-anchor="middle" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="11" fill="#ffffff">壊れたファイル</text>

<text x="20" y="296" font-family="Yu Gothic UI, Meiryo, sans-serif" font-size="12" fill="#4a5568">止めるときは終了コード 3。何も書き込まず、--from の指定を促す。</text>
</svg>
